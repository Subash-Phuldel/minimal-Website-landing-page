<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header
      class="bg-black text-white flex flex-row justify-between py-4 px-16 text-sm"
    >
      <a href="#" class="logo font-bold text-2xl tracking-widest nav-logo"
        >Fat & Fit</a
      >
      <nav
        class="w-4/12 flex flex-row justify-between font-medium items-center"
      >
        <a href="#" class="nav-link hover:line-through decoration-2"
          >All Clothings</a
        >
        <a href="#" class="nav-link hover:line-through decoration-2">New In</a>
        <a href="#" class="nav-link hover:line-through decoration-2"
          >Editorial</a
        >
        <a href="#" class="nav-link hover:line-through decoration-2">Outwear</a>
        <a href="#" class="nav-link hover:line-through decoration-2"
          >Collection</a
        >
      </nav>
    </header>
    <main
      class="flex flex-row max-h-[93.6vh] overflow-hidden text-white -mt-16"
    >
      <div class="relative">
        <div class="brightness-50">
          <img src="./img/men.avif" alt="Men" />
          <div class="img-overlay w-full h-full bg-black z-10"></div>
        </div>
        <div
          class="absolute bottom-1/4 left-1/2 -translate-x-[50%] translate-y-[100%] text-center"
        >
          <h1 class="font-serif text-8xl mb-8">MEN</h1>
          <h5 class="tracking-[2.2rem] font-bold text-xl">FASHION</h5>
        </div>
      </div>
      <div class="relative">
        <div class="brightness-50">
          <img src="./img/women.avif" alt="WOmen" />
          <div class="img-overlay w-full h-full bg-black z-10 absolute"></div>
        </div>
        <div
          class="absolute bottom-1/4 left-1/2 -translate-x-[50%] translate-y-[100%] text-center"
        >
          <h1 class="font-serif text-8xl mb-8">WOMEN</h1>
          <h5 class="tracking-[2.2rem] font-bold text-xl">FASHION</h5>
        </div>
      </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
